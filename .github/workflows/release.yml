name: Build and release

# CI builds and publishes an UNSIGNED extension ZIP only. It never holds the CRX
# signing key or Chrome Web Store credentials; signing and store upload happen on
# a separately trusted machine (see docs/development.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true

      # Bootstrap install; project scripts use the canary pinned in bun.lock.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      - run: bun install --frozen-lockfile
      - run: bun run check

      - name: Package
        run: |
          mkdir out
          (cd dist && zip -qr ../out/devtools-plus-plus.zip .)
          (cd out && sha256sum devtools-plus-plus.zip > devtools-plus-plus.zip.sha256)

      - name: Publish versioned and rolling releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(bun -p "require('./package.json').version")
          notes="$RUNNER_TEMP/notes.md"
          # Fails when CHANGELOG.md has no non-empty section for this version.
          bun scripts/release/changelog-notes.js "$version" > "$notes"

          # Published versions keep their original tag and assets; only notes can change.
          if gh release view "v$version" > /dev/null 2>&1; then
            gh release edit "v$version" --notes-file "$notes"
          else
            gh release create "v$version" out/* --target "$GITHUB_SHA" \
              --title "DevTools++ $version" --notes-file "$notes" --latest=false
          fi

          short=${GITHUB_SHA::7}
          title="Latest build (v$version, $short)"
          # Recreate the release after packaging so its publication time matches this build.
          # Keep the rolling tag and download URLs; only the release object is replaced.
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          if gh release view latest > /dev/null 2>&1; then
            gh release delete latest --yes
          fi
          gh release create latest out/* --verify-tag --latest \
            --target "$GITHUB_SHA" --title "$title" --notes-file "$notes"
