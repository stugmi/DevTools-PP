name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bootstrap install; project scripts use the canary pinned in bun.lock.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - run: bun install --frozen-lockfile
      - run: bun run check

      - name: Package
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          mkdir out
          (cd dist && zip -qr ../out/source-exporter.zip .)
          if [ -n "$CRX_PRIVATE_KEY" ]; then
            printf '%s\n' "$CRX_PRIVATE_KEY" > "$RUNNER_TEMP/key.pem"
            bun x --bun --no-install crx3 -p "$RUNNER_TEMP/key.pem" -o out/source-exporter.crx dist
            rm "$RUNNER_TEMP/key.pem"
          else
            echo "::warning::CRX_PRIVATE_KEY secret not set; publishing zip only"
          fi

      - name: Publish versioned and rolling releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(bun -p "require('./package.json').version")
          notes="$RUNNER_TEMP/notes.md"
          # Fails when CHANGELOG.md has no non-empty section for this version.
          bun scripts/changelog-notes.js "$version" > "$notes"

          # Published versions keep their original tag and assets; only notes can change.
          if gh release view "v$version" > /dev/null 2>&1; then
            gh release edit "v$version" --notes-file "$notes"
          else
            gh release create "v$version" out/* --target "$GITHUB_SHA" \
              --title "Source Exporter $version" --notes-file "$notes" --latest=false
          fi

          short=${GITHUB_SHA::7}
          title="Latest build (v$version, $short)"
          # Recreate the release after packaging so its publication time matches this build.
          # Keep the rolling tag and download URLs; only the release object is replaced.
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          if gh release view latest > /dev/null 2>&1; then
            gh release delete latest --yes
          fi
          gh release create latest out/* --verify-tag --latest \
            --target "$GITHUB_SHA" --title "$title" --notes-file "$notes"
