name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Package
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          mkdir out
          (cd dist && zip -qr ../out/source-exporter.zip .)
          if [ -n "$CRX_PRIVATE_KEY" ]; then
            printf '%s\n' "$CRX_PRIVATE_KEY" > "$RUNNER_TEMP/key.pem"
            npx --yes crx3@2.0.0 -p "$RUNNER_TEMP/key.pem" -o out/source-exporter.crx dist
            rm "$RUNNER_TEMP/key.pem"
          else
            echo "::warning::CRX_PRIVATE_KEY secret not set; publishing zip only"
          fi

      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          short=${GITHUB_SHA::7}
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest out/* \
            --target "$GITHUB_SHA" \
            --title "Latest build (v$version, $short)" \
            --notes "Automated build of $GITHUB_SHA.
          - \`source-exporter.zip\`: unpacked extension. Unzip and use Load unpacked in chrome://extensions.
          - \`source-exporter.crx\`: packed extension signed with the project key."
