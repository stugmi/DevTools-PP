name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bootstrap install; project scripts use the canary pinned in bun.lock.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - run: bun install --frozen-lockfile
      - run: bun run check

      - name: Package
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          mkdir out
          (cd dist && zip -qr ../out/source-exporter.zip .)
          if [ -n "$CRX_PRIVATE_KEY" ]; then
            printf '%s\n' "$CRX_PRIVATE_KEY" > "$RUNNER_TEMP/key.pem"
            bun x --bun --no-install crx3 -p "$RUNNER_TEMP/key.pem" -o out/source-exporter.crx dist
            rm "$RUNNER_TEMP/key.pem"
          else
            echo "::warning::CRX_PRIVATE_KEY secret not set; publishing zip only"
          fi

      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(bun -p "require('./package.json').version")
          short=${GITHUB_SHA::7}
          title="Latest build (v$version, $short)"
          notes="Automated build of $GITHUB_SHA.
          - \`source-exporter.zip\`: unpacked extension. Unzip and use Load unpacked in chrome://extensions.
          - \`source-exporter.crx\`: packed extension signed with the project key."
          # Recreate the release after packaging so its publication time matches this build.
          # Keep the rolling tag and download URLs; only the release object is replaced.
          git tag -f latest "$GITHUB_SHA"
          git push -f origin refs/tags/latest
          if gh release view latest > /dev/null 2>&1; then
            gh release delete latest --yes
          fi
          gh release create latest out/* --verify-tag --latest \
            --target "$GITHUB_SHA" --title "$title" --notes "$notes"
