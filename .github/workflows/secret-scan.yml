name: Secret scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # Full history, so a secret committed and later deleted is still found.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.4"

      # Pinned Betterleaks release, verified against a SHA-256 stored in the script.
      - run: bun scripts/secrets/betterleaks.js install
      - run: bun scripts/secrets/betterleaks.js history
