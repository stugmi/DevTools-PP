<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Source Exporter</title>
    <link rel="stylesheet" href="css/popup.css" />
  </head>

  <body>
    <h1>Source Exporter</h1>
    <p>Export source-mapped files from DevTools.</p>
    <ol class="steps">
      <li>Open DevTools (F12)</li>
      <li>Go to the <strong>Source Exporter</strong> tab</li>
      <li>Reload the page if scripts loaded before DevTools opened</li>
      <li>Right-click files or directories to export, or focus one and press Shift+F10</li>
    </ol>
  </body>
</html>
